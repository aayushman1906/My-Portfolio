<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Aayushman Thakulla</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #ecf0f3;
            padding: 20px;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ecf0f3;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 14px 14px 20px #cbced1, -14px -14px 20px white;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #d1d9e6;
        }

        .title {
            color: #333;
            font-size: 24px;
        }

        .logout-btn {
            padding: 10px 20px;
            border: none;
            background: #ecf0f3;
            color: #ef4444;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 6px 6px 10px #cbced1, -6px -6px 10px white;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .logout-btn:hover {
            box-shadow: inset 4px 4px 4px #cbced1, inset -4px -4px 4px white;
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-table th {
            text-align: left;
            padding: 15px;
            color: #555;
            font-weight: 600;
            border-bottom: 2px solid #d1d9e6;
        }

        .user-table td {
            padding: 15px;
            color: #333;
            border-bottom: 1px solid #e0e5ec;
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #555;
        }
    </style>
</head>

<body>

    <div class="dashboard-container">
        <div class="header">
            <h1 class="title">User Dashboard</h1>
            <button id="logoutBtn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <div id="loading" class="loading">Loading users...</div>

        <table class="user-table" id="userTable" style="display: none;">
            <thead>
                <tr>
                    <th>Full Name</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Signed Up</th>
                </tr>
            </thead>
            <tbody id="userTableBody">
                <!-- User rows will be inserted here -->
            </tbody>
        </table>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const logoutBtn = document.getElementById('logoutBtn');
        const userTable = document.getElementById('userTable');
        const userTableBody = document.getElementById('userTableBody');
        const loading = document.getElementById('loading');

        // Check authentication
        auth.onAuthStateChanged((user) => {
            if (user) {
                // User is signed in, fetch data
                loadUsers();
            } else {
                // No user is signed in, redirect to login
                window.location.href = "login.html";
            }
        });

        // Logout function
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                window.location.href = "login.html";
            }).catch((error) => {
                console.error("Logout Error:", error);
            });
        });

        // Fetch users from Firestore
        function loadUsers() {
            db.collection("users").orderBy("signupDate", "desc").get()
                .then((querySnapshot) => {
                    loading.style.display = 'none';
                    userTable.style.display = 'table';

                    userTableBody.innerHTML = ''; // Clear existing

                    querySnapshot.forEach((doc) => {
                        const userData = doc.data();
                        const date = new Date(userData.signupDate).toLocaleDateString();

                        const row = `
                            <tr>
                                <td>${userData.fullname || 'N/A'}</td>
                                <td>${userData.email}</td>
                                <td>${userData.role || 'user'}</td>
                                <td>${date}</td>
                            </tr>
                        `;
                        userTableBody.innerHTML += row;
                    });
                })
                .catch((error) => {
                    console.error("Error getting users: ", error);
                    loading.innerText = "Error loading data. Check permissions.";
                });
        }
    </script>
</body>

</html>
