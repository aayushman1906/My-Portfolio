<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Aayushman Thakulla</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #ecf0f3;
        }

        .login-card {
            position: relative;
            width: 350px;
            padding: 60px 40px;
            border-radius: 20px;
            /* Reduced radius closer to image */
            background: #ecf0f3;
            box-shadow: 14px 14px 20px #cbced1, -14px -14px 20px white;
        }

        .login-title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 40px;
            color: #555;
            /* Dark gray text */
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            /* Slightly darker than title */
            font-size: 16px;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            background: #ecf0f3;
            border: none;
            outline: none;
            padding: 15px 20px;
            border-radius: 50px;
            /* Fully rounded inputs */
            box-shadow: inset 6px 6px 6px #cbced1, inset -6px -6px 6px white;
            color: #555;
            font-size: 14px;
        }

        .form-input::placeholder {
            color: #777;
            /* Lighter placeholder */
            font-weight: 400;
            opacity: 0.8;
        }

        /* Password specific styling to match dots if possible, though standard pwd dots are OS specific */

        .login-btn {
            display: block;
            width: 100%;
            margin-top: 30px;
            background: #ecf0f3;
            color: #333;
            /* Dark text for button */
            font-weight: 700;
            border: none;
            outline: none;
            height: 50px;
            border-radius: 25px;
            /* Rounded button */
            cursor: pointer;
            box-shadow: 10px 10px 15px #cbced1, -10px -10px 15px white;
            /* Outset shadow */
            font-size: 16px;
            transition: all 0.3s ease;
        }

        .login-btn:hover {
            box-shadow: 6px 6px 10px #cbced1, -6px -6px 10px white;
            /* Tighter shadow on hover */
            transform: scale(0.98);
        }

        .login-btn:active {
            box-shadow: inset 4px 4px 4px #cbced1, inset -4px -4px 4px white;
            /* Inset on click */
            font-size: 15px;
        }

        .forgot-pass {
            display: block;
            text-align: center;
            margin-top: 25px;
            text-decoration: none;
            color: #666;
            /* Muted text */
            font-size: 13px;
        }

        .forgot-pass:hover {
            color: #333;
        }

        /* Home Link - positioned absolute or just below */
        .home-link {
            position: absolute;
            top: 20px;
            left: 20px;
            text-decoration: none;
            color: #555;
            font-size: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 6px 6px 10px #cbced1, -6px -6px 10px white;
            transition: all 0.3s ease;
        }

        .home-link:hover {
            box-shadow: inset 4px 4px 4px #cbced1, inset -4px -4px 4px white;
            color: #333;
        }

        /* Signup Link area below */
        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #777;
        }

        .signup-link a {
            color: #333;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        /* Font Awesome for Icons if needed (not in strict image but good for home icon) */
    </style>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <a href="index.html" class="home-link" title="Back to Home">
        <i class="fas fa-home"></i>
    </a>

    <div class="login-card">
        <h1 class="login-title">Login</h1>

        <form>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" placeholder="Username">
            </div>

            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" placeholder="*********">
            </div>

            <button type="button" class="login-btn">
                Login
            </button>
        </form>

        <a href="#" class="forgot-pass">Forgot password?</a>

        <div class="signup-link">
            Don't have an account? <a href="signup.html">Sign Up</a>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const loginBtn = document.querySelector('.login-btn');
        const emailInput = document.querySelector('input[type="text"]'); // Changed selector as per file content
        const passwordInput = document.querySelector('input[type="password"]');

        // Fix selector for email input if strictly following "text" type or add ID in HTML
        // Best to add IDs to inputs in login.html first or select by type carefully

        loginBtn.addEventListener('click', function () {
            const email = emailInput.value;
            const password = passwordInput.value;

            if (!email || !password) {
                alert("Please enter email and password");
                return;
            }

            const originalBtnText = loginBtn.innerText;
            loginBtn.innerText = 'Logging in...';
            loginBtn.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .then((userCredential) => {
                    // Signed in
                    var user = userCredential.user;
                    // Go to home page
                    window.location.href = "index.html";
                })
                .catch((error) => {
                    var errorCode = error.code;
                    var errorMessage = error.message;
                    alert("Login Failed: " + errorMessage);
                    loginBtn.innerText = originalBtnText;
                    loginBtn.disabled = false;
                });
        });
    </script>
</body>

</html>
